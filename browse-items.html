<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Items - LostFinder</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/browse-items.css">
</head>
<body>
<div class="string-layer">
  <svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
    <line x1="80" y1="150" x2="600" y2="320" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,6"/>
    <line x1="220" y1="80" x2="780" y2="490" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="3,8"/>
    <line x1="50" y1="500" x2="450" y2="280" stroke="#c0392b" stroke-width="0.7" stroke-dasharray="5,7"/>
  </svg>
</div>

<nav class="navbar">
  <a class="logo" href="index.html">
    <span class="logo-dot"></span>
    LostFinder
  </a>
  <div class="nav-links">
    <a href="index.html"><i class="fas fa-home"></i> Dashboard</a>
    <a href="browse-items.html" class="active"><i class="fas fa-search"></i> Browse</a>
    <a href="my-reports.html"><i class="fas fa-clipboard-list"></i> My Reports</a>
    <a href="messages.html"><i class="fas fa-envelope"></i> Messages</a>
    <a href="profile.html"><i class="fas fa-user-circle"></i> Profile</a>
  </div>
</nav>

<div class="browse-container">
  <div class="page-note">
    <div class="tape-strip" style="position:absolute; top:-12px; left:30px; width:70px; height:24px; background:var(--tape);"></div>
    <h2><i class="fas fa-map-pin" style="color:var(--red);"></i> Semua laporan</h2>
    <div style="display:flex; gap:15px; flex-wrap:wrap;">
      <div class="filter-group">
        <i class="fas fa-filter"></i>
        <select id="typeFilter" class="filter-select">
          <option value="all">Semua (Lost & Found)</option>
          <option value="lost">Hilang sahaja</option>
          <option value="found">Ditemui sahaja</option>
          <option value="reunited">Sudah Reunite</option>
        </select>
      </div>
      <div class="filter-group">
        <i class="fas fa-tag"></i>
        <select id="catFilter" class="filter-select">
          <option value="all">Semua Kategori</option>
          <option value="dompet">Dompet</option>
          <option value="telefon">Telefon</option>
          <option value="kunci">Kunci</option>
          <option value="beg">Beg</option>
          <option value="dokumen">Dokumen</option>
          <option value="lain">Lain-lain</option>
        </select>
      </div>
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Cari barang, lokasi..." autocomplete="off">
        <button id="clearSearchBtn"><i class="fas fa-times-circle"></i></button>
      </div>
    </div>
  </div>

  <div id="itemsGridContainer" class="items-grid"></div>
</div>

<!-- MODAL for detail & image -->
<div id="itemModal" class="modal">
  <div class="modal-content">
    <button class="modal-close" id="modalCloseBtn"><i class="fas fa-times"></i></button>
    <div id="modalImageContainer" class="modal-image"></div>
    <div class="modal-details" id="modalDetails"></div>
  </div>
</div>

<script src="/js/browse-items.js"></script>
</body>
</html>
