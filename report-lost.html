<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Report Lost — LostFinder</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/report-lost.css">
</head>
<body>
  <div class="corkboard-bg">
    <nav class="navbar">
      <a class="logo" href="index.html">
        <span class="logo-dot"></span>
        LostFinder
      </a>
      <div class="nav-links">
        <a href="index.html"><i class="fas fa-home"></i> Dashboard</a>
        <a href="browse-items.html"><i class="fas fa-search"></i> Browse</a>
        <a href="my-reports.html"><i class="fas fa-clipboard-list"></i> My Reports</a>
        <a href="messages.html"><i class="fas fa-envelope"></i> Messages</a>
        <a href="profile.html"><i class="fas fa-user-circle"></i> Profile</a>
      </div>
    </nav>

    <div class="board-container">
      <!-- sticky note intro -->
      <div class="sticky-note">
        <div class="tape"></div>
        <h2><i class="fas fa-frown"></i> Laporkan Barang Hilang</h2>
        <p>Setiap laporan akan muncul di papan buletin & diselaraskan dengan komuniti. Siapa tahu mungkin ada yang terjumpa barang awak.</p>
      </div>

      <!-- main form card -->
      <div class="report-card">
        <div class="pin-red"></div>
        <form id="reportLostForm">
          <div class="form-group">
            <label><i class="fas fa-tag"></i> Nama barang / Jenama</label>
            <input type="text" id="itemName" placeholder="cth. Dompet kulit hitam, iPhone 13, Kunci kereta..." required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label><i class="fas fa-layer-group"></i> Kategori</label>
              <select id="itemCategory">
                <option value="dompet">Dompet / Wallet</option>
                <option value="telefon">Telefon / Smartphone</option>
                <option value="kunci">Kunci / Keys</option>
                <option value="beg">Beg / Bag</option>
                <option value="dokumen">Dokumen Penting</option>
                <option value="elektronik">Elektronik / Lain</option>
                <option value="lain">Lain-lain</option>
              </select>
            </div>
            <div class="form-group">
              <label><i class="fas fa-calendar-alt"></i> Tarikh hilang</label>
              <input type="date" id="lostDate">
            </div>
          </div>

          <div class="form-group">
            <label><i class="fas fa-map-pin"></i> Lokasi terakhir dilihat</label>
            <input type="text" id="lostLocation" placeholder="cth. Kafe UTM, Masjid Putra, MRT Station..." required>
          </div>

          <div class="form-group">
            <label><i class="fas fa-align-left"></i> Penerangan terperinci</label>
            <textarea id="itemDescription" placeholder="Warna, saiz, tanda khas, keadaan barang, sebarang butiran penting supaya orang mudah kenal..."></textarea>
          </div>

          <!-- Image upload zone ala corkboard -->
          <div class="form-group">
            <label><i class="fas fa-camera"></i> Gambar barang (optional)</label>
            <div class="upload-area" id="uploadZone">
              <i class="fas fa-cloud-upload-alt"></i>
              <p>Klik atau seret gambar ke sini</p>
              <div class="file-hint">JPG, PNG, WEBP (max 5MB)</div>
              <input type="file" id="imageInput" accept="image/jpeg,image/png,image/webp" style="display: none;">
            </div>
            <div class="preview-box" id="previewBox">
              <img id="previewImg" alt="preview">
              <button type="button" class="remove-img" id="removeImageBtn"><i class="fas fa-trash-alt"></i> Buang gambar</button>
            </div>
          </div>

          <div class="form-group">
            <label><i class="fas fa-phone-alt"></i> Kontak (email / nombor)</label>
            <input type="text" id="contactInfo" placeholder="supaya orang yang jumpa boleh hubungi awak">
          </div>

          <button type="submit" class="submit-btn">
            <i class="fas fa-thumbtack"></i> Hantar Laporan Hilang
          </button>
        </form>
      </div>
    </div>
  </div>

  <div id="toastMsg" class="toast-msg">✓ Laporan berjaya dihantar!</div>

  <script src="/js/report-lost.js"></script>
</body>
</html>
