<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Chat Conversation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">...</nav>
    <div class="container chat-room">
        <div id="chatHeader"></div>
        <div id="chatMessages" class="chat-messages"></div>
        <div class="chat-input-area">
            <input type="text" id="chatMessageInput" placeholder="Type a message...">
            <button id="sendMsgBtn" class="btn btn-primary"><i class="fas fa-paper-plane"></i> Send</button>
        </div>
    </div>
    <script src="app.js"></script>
    <script>initChatRoom();</script>
</body>
</html>
